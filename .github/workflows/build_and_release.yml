name: FarSure Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK and Upload Versioned Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          COMMITS=$(git rev-list --count HEAD)
          VERSION="1.1.${COMMITS}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

      - name: Build Android APK (Release, universal)
        run: flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apk/FarSure-v${{ env.VERSION }}.apk

      - name: Delete Old Rolling Release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-development --cleanup-tag -y || true

      - name: Publish Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "FarSure v${{ env.VERSION }}"
          body: |
            Automatic release build **v${{ env.VERSION }}** (commit `${{ github.sha }}`).
            Universal release APK (all ABIs, one file), signed with the same development key as earlier builds, so it installs over previous versions.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-apk/FarSure-v${{ env.VERSION }}.apk
          prerelease: false

